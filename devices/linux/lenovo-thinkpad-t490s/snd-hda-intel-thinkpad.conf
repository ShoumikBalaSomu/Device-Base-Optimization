# ==============================================================================
# ThinkPad T490s Realtek ALC257 Audio DAC Zero Power-Gating Latency
# Repository: ShoumikBalaSomu/Device-Base-Optimization
# ==============================================================================
# power_save=0: Prevents DAC sleep after 1 second of inactivity, eliminating audio pop/delay
# power_save_controller=N: Disables audio controller clock-gating to stop stream startup clicks
options snd_hda_intel power_save=0 power_save_controller=N
