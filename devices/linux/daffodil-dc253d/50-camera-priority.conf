# ==============================================================================
# Daffodil DC253D WirePlumber Camera Configuration
# Assigns primary priority to the hardware FHD webcam
# ==============================================================================
monitor.v4l2.rules = [
  {
    matches = [
      {
        node.name = "~v4l2_input.*04f2.*"
      },
      {
        api.v4l2.path = "/dev/video0"
      }
    ]
    actions = {
      update-props = {
        priority.session = 2000
        priority.driver = 2000
        media.role = "Camera"
      }
    }
  }
]
