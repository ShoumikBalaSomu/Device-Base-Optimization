# ==============================================================================
# Daffodil DC253D SunplusIT / Chicony WebCam Stability & No-Drop Tuning
# ==============================================================================
# nodrop=1: Prevents driver from dropping corrupted/incomplete frames during
#           lighting changes and auto-exposure transitions.
# quirks=128 (0x80 UVC_QUIRK_FIX_BANDWIDTH): Enforces software bandwidth
#            calculation instead of trusting inaccurate descriptor reporting.
options uvcvideo nodrop=1 quirks=128
